name: Extract website
on:
  push:
    paths:
      - '*.rar'
      - '.github/workflows/extract-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive to repository root
        run: |
          set -e
          if [ ! -f microwell-site-updated.rar ]; then echo "No archive found"; exit 0; fi
          command -v 7z || (sudo apt-get update && sudo apt-get install -y p7zip-full)
          mkdir -p /tmp/site
          7z x -o/tmp/site microwell-site-updated.rar
          SRC=/tmp/site/microwell-site-updated
          [ -d "$SRC" ] || SRC=/tmp/site
          cp -r "$SRC"/. .
          git rm -q microwell-site-updated.rar
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract website files from archive to repository root"
          git push
